{% extends "base.html" %}

{% block content %}
<h2>Reportes de Produccion</h2>

<div style="text-align: center; margin: 40px 0;">
    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('admin.production_stats') }}"
           class="btn btn-primary" style="padding: 16px 32px; font-size: 1rem;">
            📈 Estadísticas
        </a>

        <a href="{{ url_for('admin.production_view') }}" 
           class="btn btn-success" style="padding: 16px 32px; font-size: 1rem;">
            👁️ Ver Reportes
        </a>

        <a href="{{ url_for('admin.download_report_csv', report_type='production') }}" 
           class="btn btn-info" style="padding: 16px 32px; font-size: 1rem;">
            📊 Descargar CSV
        </a>
    </div>
</div>

<div style="margin-top: 40px; text-align: center;">
    <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">Volver al Panel</a>
</div>
{% endblock %}
