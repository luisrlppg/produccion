<div class="form-group">
    <label for="item_name">{{ get_text('item_name') }}:</label>
    <input type="text" id="item_name" name="item_name" required>
</div>

<div class="form-group">
    <label for="location">{{ get_text('location') }}:</label>
    <input type="text" id="location" name="location" required>
</div>

<div class="form-group">
    <label for="failure_description">{{ get_text('failure_description') }}:</label>
    <textarea id="failure_description" name="failure_description" required></textarea>
</div>

<div class="form-group">
    <label for="additional_info">{{ get_text('additional_info') }}:</label>
    <textarea id="additional_info" name="additional_info"></textarea>
</div>

<div class="form-group">
    <label for="photo">{{ get_text('photo') }}:</label>
    <input type="file" id="photo" name="photo" accept="image/*">
</div>
