<script>
// ---------------------------------------------------------------------------
// Form validation
// ---------------------------------------------------------------------------

function validateRequiredFields() {
    const requiredFields = [
        { id: 'name',             name: 'Nombre' },
        { id: 'job_shift',        name: 'Turno de Trabajo' },
        { id: 'date',             name: 'Fecha' },
        { id: 'quantity_persons', name: 'Cantidad de Personas' }
    ];

    let isValid = true;
    const errors = [];

    requiredFields.forEach(field => {
        const el = document.getElementById(field.id);
        if (el) el.style.borderColor = '#cbd5e0';
    });

    requiredFields.forEach(field => {
        const el = document.getElementById(field.id);
        if (el && !el.value.trim()) {
            el.style.borderColor = '#e53e3e';
            errors.push(`El campo '${field.name}' es obligatorio`);
            isValid = false;
        }
    });

    const qtyEl = document.getElementById('quantity_persons');
    if (qtyEl && qtyEl.value.trim()) {
        const qty = parseInt(qtyEl.value.trim());
        if (isNaN(qty) || qty <= 0) {
            qtyEl.style.borderColor = '#e53e3e';
            errors.push('La cantidad de personas debe ser un número mayor a 0');
            isValid = false;
        }
    }

    // Validar filas de productos: si hay nombre debe haber cantidad y viceversa
    const SECTIONS = {{ production_sections | tojson }};
    SECTIONS.forEach(({ css_prefix: prefix, label }) => {
        document.querySelectorAll('.' + prefix + '-row').forEach((row, i) => {
            const nameEl = row.querySelector('.' + prefix + '-name');
            const qtyEl  = row.querySelector('.' + prefix + '-qty');
            if (!nameEl || !qtyEl) return;

            const hasName = nameEl.value.trim() !== '';
            const hasQty  = qtyEl.value.trim() !== '' && parseInt(qtyEl.value.trim()) > 0;

            nameEl.style.borderColor = '#cbd5e0';
            qtyEl.style.borderColor  = '#cbd5e0';

            if (hasName && !hasQty) {
                qtyEl.style.borderColor = '#e53e3e';
                errors.push(`${label} — fila ${i + 1}: falta la cantidad para "${nameEl.value.trim()}"`);
                isValid = false;
            } else if (!hasName && hasQty) {
                nameEl.style.borderColor = '#e53e3e';
                errors.push(`${label} — fila ${i + 1}: falta el nombre del producto`);
                isValid = false;
            }
        });
    });

    // Validar filas de máquinas
    [1, 2, 3].forEach(i => {
        document.querySelectorAll(`#machine${i}_rows .machine-row`).forEach((row, idx) => {
            const qtyEl   = row.querySelector('.machine-qty');
            const typeEl  = row.querySelector('.machine-type');
            const colorEl = row.querySelector('.machine-color');
            if (!qtyEl || !typeEl || !colorEl) return;

            const hasQty   = qtyEl.value.trim() !== '' && parseInt(qtyEl.value.trim()) > 0;
            const hasType  = typeEl.value !== '';
            const hasColor = colorEl.value !== '';
            const anyFilled = hasQty || hasType || hasColor;

            qtyEl.style.borderColor   = '#cbd5e0';
            typeEl.style.borderColor  = '#cbd5e0';
            colorEl.style.borderColor = '#cbd5e0';

            if (anyFilled) {
                if (!hasQty) {
                    qtyEl.style.borderColor = '#e53e3e';
                    errors.push(`Máquina ${i}, fila ${idx + 1}: falta la cantidad`);
                    isValid = false;
                }
                if (!hasType) {
                    typeEl.style.borderColor = '#e53e3e';
                    errors.push(`Máquina ${i}, fila ${idx + 1}: falta el tipo de cepillo`);
                    isValid = false;
                }
                if (!hasColor) {
                    colorEl.style.borderColor = '#e53e3e';
                    errors.push(`Máquina ${i}, fila ${idx + 1}: falta el color`);
                    isValid = false;
                }
            }
        });
    });

    if (!isValid) alert('Por favor corrige los siguientes errores:\n\n' + errors.join('\n'));
    return isValid;
}

document.addEventListener('DOMContentLoaded', function () {
    ['name', 'job_shift', 'date', 'quantity_persons'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', function () {
            this.style.borderColor = this.value.trim() ? '#48bb78' : '#cbd5e0';
        });
        el.addEventListener('blur', function () {
            if (!this.value.trim()) this.style.borderColor = '#e53e3e';
        });
    });

    // Bind validación en tiempo real a las filas iniciales
    const SECTION_PREFIXES = {{ production_sections | map(attribute='css_prefix') | list | tojson }};
    SECTION_PREFIXES.forEach(prefix => {
        document.querySelectorAll('.' + prefix + '-row').forEach(row => {
            _bindRowValidation(row, prefix);
        });
    });

    // Bind validación en tiempo real a las filas de máquinas
    [1, 2, 3].forEach(i => {
        document.querySelectorAll(`#machine${i}_rows .machine-row`).forEach(row => {
            _bindMachineRowValidation(row, i);
        });
    });
});

// Feedback visual en tiempo real para fila de máquina
function _bindMachineRowValidation(row, machineNum) {
    const qtyEl   = row.querySelector('.machine-qty');
    const typeEl  = row.querySelector('.machine-type');
    const colorEl = row.querySelector('.machine-color');
    if (!qtyEl || !typeEl || !colorEl) return;

    function check() {
        const hasQty   = qtyEl.value.trim() !== '' && parseInt(qtyEl.value.trim()) > 0;
        const hasType  = typeEl.value !== '';
        const hasColor = colorEl.value !== '';
        const anyFilled = hasQty || hasType || hasColor;
        const allFilled = hasQty && hasType && hasColor;

        if (!anyFilled) {
            qtyEl.style.borderColor   = '#cbd5e0';
            typeEl.style.borderColor  = '#cbd5e0';
            colorEl.style.borderColor = '#cbd5e0';
        } else if (allFilled) {
            qtyEl.style.borderColor   = '#48bb78';
            typeEl.style.borderColor  = '#48bb78';
            colorEl.style.borderColor = '#48bb78';
        } else {
            qtyEl.style.borderColor   = hasQty   ? '#48bb78' : '#e53e3e';
            typeEl.style.borderColor  = hasType  ? '#48bb78' : '#e53e3e';
            colorEl.style.borderColor = hasColor ? '#48bb78' : '#e53e3e';
        }
    }

    qtyEl.addEventListener('input', check);
    qtyEl.addEventListener('blur',  check);
    typeEl.addEventListener('change', check);
    colorEl.addEventListener('change', check);
}

// Feedback visual en tiempo real para una fila de producto
function _bindRowValidation(row, prefix) {
    const nameEl = row.querySelector('.' + prefix + '-name');
    const qtyEl  = row.querySelector('.' + prefix + '-qty');
    if (!nameEl || !qtyEl) return;

    function check() {
        const hasName = nameEl.value.trim() !== '';
        const hasQty  = qtyEl.value.trim() !== '' && parseInt(qtyEl.value.trim()) > 0;

        if (!hasName && !hasQty) {
            nameEl.style.borderColor = '#cbd5e0';
            qtyEl.style.borderColor  = '#cbd5e0';
        } else if (hasName && hasQty) {
            nameEl.style.borderColor = '#48bb78';
            qtyEl.style.borderColor  = '#48bb78';
        } else {
            nameEl.style.borderColor = hasName ? '#48bb78' : '#e53e3e';
            qtyEl.style.borderColor  = hasQty  ? '#48bb78' : '#e53e3e';
        }
    }

    nameEl.addEventListener('input', check);
    nameEl.addEventListener('blur',  check);
    qtyEl.addEventListener('input',  check);
    qtyEl.addEventListener('blur',   check);
}

// ---------------------------------------------------------------------------
// Product rows
// ---------------------------------------------------------------------------

function addRow(prefix) {
    const container = document.getElementById(prefix + '_rows');
    const row = document.createElement('div');
    row.className = prefix + '-row prod-row';
    row.innerHTML = `
        <div class="prod-row-name">
            <label>Producto:</label>
            <input type="text" class="${prefix}-name" placeholder="Nombre del producto">
        </div>
        <div class="prod-row-qty">
            <label>Cantidad: <span style="color:#e53e3e">*</span></label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="${prefix}-qty" placeholder="0">
        </div>
        <button type="button" onclick="removeRow(this,'${prefix}')" class="btn-remove prod-row-remove" aria-label="Eliminar">×</button>`;
    container.appendChild(row);
    _bindRowValidation(row, prefix);
}

function removeRow(btn, prefix) {
    const rows = document.querySelectorAll('.' + prefix + '-row');
    if (rows.length > 1) btn.closest('.' + prefix + '-row').remove();
}

function collectRows(prefix, hiddenId) {
    const products = [];
    document.querySelectorAll('.' + prefix + '-row').forEach(row => {
        const name = row.querySelector('.' + prefix + '-name').value.trim();
        const qty  = row.querySelector('.' + prefix + '-qty').value.trim();
        if (name && qty && parseInt(qty) > 0) products.push({ name, quantity: qty });
    });
    document.getElementById(hiddenId).value = JSON.stringify(products);
}

// ---------------------------------------------------------------------------
// Machine rows
// ---------------------------------------------------------------------------

function addMachineRow(num) {
    const container = document.getElementById('machine' + num + '_rows');
    const template = container.querySelector('.machine-row');
    const row = document.createElement('div');
    row.className = 'machine-row';
    row.setAttribute('data-machine', num);
    row.innerHTML = template.innerHTML;
    container.appendChild(row);
    _bindMachineRowValidation(row, num);
}

function removeMachineRow(btn, num) {
    const rows = document.querySelectorAll('#machine' + num + '_rows .machine-row');
    if (rows.length > 1) btn.closest('.machine-row').remove();
}

function collectMachineData() {
    const machines = [];
    [1, 2, 3].forEach(num => {
        document.querySelectorAll('#machine' + num + '_rows .machine-row').forEach(row => {
            const qtyEl   = row.querySelector('.machine-qty');
            const typeEl  = row.querySelector('.machine-type');
            const colorEl = row.querySelector('.machine-color');
            const qty     = qtyEl ? qtyEl.value.trim() : '';
            if (qty && parseInt(qty) > 0) {
                machines.push({
                    maquina: num,
                    cantidad: parseInt(qty),
                    tipo: typeEl ? typeEl.value : '',
                    color: colorEl ? colorEl.value : '',
                });
            }
        });
    });
    document.getElementById('maquinas').value = JSON.stringify(machines);
}

// ---------------------------------------------------------------------------
// Delivery rows
// ---------------------------------------------------------------------------

function addDeliveryRow() {
    const container = document.getElementById('delivery_rows');
    const row = document.createElement('div');
    row.className = 'delivery-row prod-row prod-row--delivery';
    row.innerHTML = `
        <div class="prod-row-name">
            <label>Cliente:</label>
            <input type="text" class="delivery-customer" placeholder="Nombre del cliente">
        </div>
        <div class="prod-row-desc">
            <label>Descripcion del producto:</label>
            <input type="text" class="delivery-desc" placeholder="Descripcion del producto entregado">
        </div>
        <button type="button" onclick="removeDeliveryRow(this)" class="btn-remove prod-row-remove" aria-label="Eliminar">×</button>`;
    container.appendChild(row);
}

function removeDeliveryRow(btn) {
    const rows = document.querySelectorAll('.delivery-row');
    if (rows.length > 1) btn.closest('.delivery-row').remove();
}

function collectDeliveries() {
    const deliveries = [];
    document.querySelectorAll('.delivery-row').forEach(row => {
        const customer = row.querySelector('.delivery-customer').value.trim();
        const desc     = row.querySelector('.delivery-desc').value.trim();
        if (customer || desc) deliveries.push({ customer, description: desc, quantity: 1 });
    });
    document.getElementById('deliveries').value = JSON.stringify(deliveries);
}

// ---------------------------------------------------------------------------
// Submit
// ---------------------------------------------------------------------------

document.querySelector('form').addEventListener('submit', function (e) {
    if (!validateRequiredFields()) { e.preventDefault(); return false; }
    const ALL_SECTIONS = {{ production_sections | tojson }};
    ALL_SECTIONS.forEach(s => collectRows(s.css_prefix, s.css_prefix + '_products'));
    collectMachineData();
    collectDeliveries();
    const btn = this.querySelector('button[type="submit"]');
    if (btn) { btn.innerHTML = '⏳ Enviando...'; btn.disabled = true; }
});
</script>
