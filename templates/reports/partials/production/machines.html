<div class="section-card">
    <h3>{{ get_text('mascara_brush_production') }}</h3>

    {% for i in [1, 2, 3] %}
    <div class="form-group">
        <label>{{ get_text('machine_' ~ i) }}</label>
        <div class="dynamic-row" style="background: transparent; border: none; padding: 0; margin-bottom: 0;">
            <div class="field-sm">
                <label for="machine{{ i }}_quantity" style="font-weight: normal;">{{ get_text('quantity') }}</label>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="machine{{ i }}_quantity" name="machine{{ i }}_quantity" placeholder="0">
            </div>
            <div class="field-md">
                <label for="machine{{ i }}_brush_type" style="font-weight: normal;">{{ get_text('brush_type') }}</label>
                <select id="machine{{ i }}_brush_type" name="machine{{ i }}_brush_type">
                    <option value="">Seleccionar</option>
                    <option value="straight">Recto</option>
                    <option value="spiral">Espiral</option>
                    <option value="bullet">Bala</option>
                    <option value="mini_bullet">Balita</option>
                    <option value="pine">Pino</option>
                    <option value="peanut">Cacahuate</option>
                    <option value="balloon">Globo</option>
                </select>
            </div>
            <div class="field-md">
                <label for="machine{{ i }}_color" style="font-weight: normal;">{{ get_text('color') }}</label>
                <select id="machine{{ i }}_color" name="machine{{ i }}_color">
                    <option value="">Seleccionar</option>
                    <option value="black">Negro</option>
                    <option value="brown">Cafe</option>
                    <option value="blue">Azul</option>
                    <option value="green">Verde</option>
                    <option value="turquoise">Turquesa</option>
                    <option value="pink">Rosa</option>
                    <option value="purple">Morado</option>
                    <option value="transparent">Transparente</option>
                </select>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
