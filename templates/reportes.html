{% extends "base.html" %}

{% block content %}
<h2 style="text-align:center; margin-bottom:32px;">Reportes</h2>

<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; max-width:960px; margin:0 auto;">

    <a href="{{ url_for('report_form', report_type='production') }}"
       style="display:block; padding:28px 20px; background:#f0fff4; border:1px solid #9ae6b4; border-radius:14px; text-decoration:none; text-align:center; transition:box-shadow .2s;"
       onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'"
       onmouseout="this.style.boxShadow='none'">
        <div style="font-size:2.2rem; margin-bottom:10px;">📝</div>
        <div style="font-weight:700; color:#276749; font-size:1rem;">Nuevo Reporte</div>
        <div style="font-size:.82rem; color:#4a5568; margin-top:6px;">Registrar producción del turno</div>
    </a>

    <a href="{{ url_for('panel.production_view') }}"
       style="display:block; padding:28px 20px; background:#ebf8ff; border:1px solid #bee3f8; border-radius:14px; text-decoration:none; text-align:center; transition:box-shadow .2s;"
       onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'"
       onmouseout="this.style.boxShadow='none'">
        <div style="font-size:2.2rem; margin-bottom:10px;">📂</div>
        <div style="font-weight:700; color:#2b6cb0; font-size:1rem;">Ver Reportes</div>
        <div style="font-size:.82rem; color:#4a5568; margin-top:6px;">Consultar historial por fecha</div>
    </a>

    <a href="{{ url_for('panel.production_stats') }}"
       style="display:block; padding:28px 20px; background:#faf5ff; border:1px solid #d6bcfa; border-radius:14px; text-decoration:none; text-align:center; transition:box-shadow .2s;"
       onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'"
       onmouseout="this.style.boxShadow='none'">
        <div style="font-size:2.2rem; margin-bottom:10px;">📈</div>
        <div style="font-weight:700; color:#553c9a; font-size:1rem;">Estadísticas</div>
        <div style="font-size:.82rem; color:#4a5568; margin-top:6px;">Gráficas y métricas de producción</div>
    </a>

    <!-- ── Descargas ── -->
    <div style="padding:28px 20px; background:#fffaf0; border:1px solid #fbd38d; border-radius:14px; text-align:center;">
        <div style="font-size:2.2rem; margin-bottom:10px;">⬇️</div>
        <div style="font-weight:700; color:#744210; font-size:1rem; margin-bottom:12px;">Descargar CSV</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <a href="{{ url_for('panel.download_report_csv', report_type='production') }}"
               style="display:block; padding:7px 14px; background:#ed8936; color:#fff; border-radius:8px; font-size:.82rem; font-weight:600; text-decoration:none; transition:opacity .15s;"
               onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                📋 Producción
            </a>
            <a href="{{ url_for('panel.download_report_csv', report_type='personal') }}"
               style="display:block; padding:7px 14px; background:#ed8936; color:#fff; border-radius:8px; font-size:.82rem; font-weight:600; text-decoration:none; transition:opacity .15s;"
               onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                👤 Personal
            </a>
            <a href="{{ url_for('panel.download_report_csv', report_type='company') }}"
               style="display:block; padding:7px 14px; background:#ed8936; color:#fff; border-radius:8px; font-size:.82rem; font-weight:600; text-decoration:none; transition:opacity .15s;"
               onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                🏢 Empresa
            </a>
        </div>
    </div>

</div>

<div style="text-align:center; margin-top:32px;">
    <a href="{{ url_for('index') }}" style="color:#718096; font-size:.9rem; text-decoration:none;">← Volver al inicio</a>
</div>
{% endblock %}
