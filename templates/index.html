{% extends "base.html" %}

{% block content %}
<h2 style="text-align:center; margin-bottom:32px;">Panel Principal</h2>

<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:24px; max-width:600px; margin:0 auto;">

    <a href="{{ url_for('reportes') }}"
       style="display:block; padding:32px 24px; background:#ebf8ff; border:1px solid #bee3f8; border-radius:14px; text-decoration:none; text-align:center; transition:box-shadow .2s;"
       onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'"
       onmouseout="this.style.boxShadow='none'">
        <div style="font-size:2.5rem; margin-bottom:10px;">📋</div>
        <div style="font-weight:700; color:#2b6cb0; font-size:1.1rem;">Reportes</div>
        <div style="font-size:.85rem; color:#4a5568; margin-top:6px;">Nuevo reporte o ver historial</div>
    </a>

    <a href="{{ url_for('signage.index') }}"
       style="display:block; padding:32px 24px; background:#faf5ff; border:1px solid #d6bcfa; border-radius:14px; text-decoration:none; text-align:center; transition:box-shadow .2s;"
       onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'"
       onmouseout="this.style.boxShadow='none'">
        <div style="font-size:2.5rem; margin-bottom:10px;">🏭</div>
        <div style="font-weight:700; color:#553c9a; font-size:1.1rem;">Fabricación y Stock</div>
        <div style="font-size:.85rem; color:#4a5568; margin-top:6px;">Órdenes activas y monitor de stock</div>
    </a>

</div>
{% endblock %}
