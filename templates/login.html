<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — {{ section }} — PPG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem;
        }
        .login-logo { text-align: center; margin-bottom: 1.8rem; }
        .login-logo .icon { font-size: 2.8rem; color: #0066cc; }
        .login-logo h1 { font-size: 1.4rem; font-weight: 700; color: #222; margin-top: 0.5rem; }
        .login-logo p  { font-size: 0.85rem; color: #888; margin: 0; }
        .form-label    { font-size: 0.85rem; font-weight: 600; color: #444; }
        .btn-login {
            background: #0066cc; border: none; width: 100%;
            padding: 0.65rem; font-size: 1rem; font-weight: 600;
            border-radius: 8px; color: #fff; margin-top: 0.5rem;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #0052a3; }
        .error-msg {
            background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b;
            border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.85rem;
            margin-bottom: 1rem; text-align: center;
        }
        .back-link {
            display: block; text-align: center; margin-top: 1.2rem;
            font-size: 0.85rem; color: #888; text-decoration: none;
        }
        .back-link:hover { color: #555; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="icon">🏭</div>
            <h1>Plásticos Plasa</h1>
            <p>{{ section }}</p>
        </div>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username"
                       class="form-control" autocomplete="username"
                       autofocus required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password"
                       class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">← Volver al inicio</a>
    </div>
</body>
</html>
