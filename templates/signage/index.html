{% extends "signage/base.html" %}

{% block title %}PPG Producción{% endblock %}

{% block content %}
<div class="container-fluid px-4">

    <ul class="nav nav-tabs mb-4" id="mainTabs">
        <li class="nav-item">
            <button class="nav-link active" id="tab-lista" data-tab="vista-lista">
                <i class="fas fa-list me-1"></i> Lista de Producción
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-stock" data-tab="vista-stock">
                <i class="fas fa-exclamation-triangle me-1"></i> Monitor de Stock
                <span id="stockBadge" class="badge bg-danger ms-1" style="display:none"></span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-ventas" data-tab="vista-ventas">
                <i class="fas fa-shopping-cart me-1"></i> Ventas
                <span id="ventasBadge" class="badge bg-primary ms-1" style="display:none"></span>
            </button>
        </li>
    </ul>

    <!-- ── Lista de Producción ─────────────────────────────────────────────── -->
    <div id="vista-lista" class="tab-content-panel">

        <!-- Estado inicial: botón de carga -->
        <div id="estado-inicial" class="text-center py-5">
            <p class="text-muted mb-4">Los datos no se cargan automáticamente.</p>
            <button id="loadDataBtn" class="btn btn-primary btn-lg">
                <i class="fas fa-download me-2"></i> Cargar datos de Odoo
            </button>
        </div>

        <!-- Skeleton mientras carga -->
        <div id="skeleton-lista" style="display:none">
            <div class="production-grid-list">
                {% for _ in range(3) %}
                <div class="pgl-column">
                    <div class="pgl-header" style="background:#cbd5e0; height:38px;"></div>
                    <div class="pgl-items">
                        {% for _ in range(5) %}
                        <div style="height:34px; background:#e2e8f0; border-radius:6px; margin-bottom:4px; animation: pulse 1.4s infinite;"></div>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Contenido real (oculto hasta que cargue) -->
        <div id="content-lista" style="display:none">
            <form action="{{ url_for('signage.update_display') }}" method="POST" id="displayForm">
                <!-- Campo oculto: items seleccionados serializados como JSON -->
                <input type="hidden" name="selected_items" id="selectedItemsInput" value="[]">
                <div class="pgl-toolbar">
                    <button type="button" id="reloadDataBtn" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-sync-alt me-1"></i> Actualizar
                    </button>
                    <button type="submit" class="btn btn-success btn-sm px-4"
                            onclick="serializeSelected()">
                        <i class="fas fa-save me-1"></i> Guardar Selección
                    </button>
                </div>
                <div class="production-grid-list" id="productionGrid"></div>
            </form>
        </div>

        <div id="error-lista" class="alert alert-danger mt-3" style="display:none"></div>
    </div>

    <!-- ── Monitor de Stock ───────────────────────────────────────────────── -->
    <div id="vista-stock" class="tab-content-panel d-none">

        <div class="d-flex gap-2 mb-4 flex-wrap">
            <button id="sendStockReportBtn" class="btn btn-warning">
                <i class="fas fa-bell"></i> Enviar Reporte de Stock Manual
            </button>
            <button id="testNotificationsBtn" class="btn btn-info">
                <i class="fas fa-paper-plane"></i> Probar Notificaciones
            </button>
        </div>

        <div id="messageArea" class="mb-3"></div>

        <!-- Resumen stock (se llena con JS) -->
        <div class="card mb-4" id="stockSummaryCard" style="display:none">
            <div class="card-body text-center" id="stockSummary"></div>
        </div>

        <div id="stockTable"></div>

        <div class="mt-4">
            <button id="refreshStockBtn" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i> Consultar Ahora
            </button>
        </div>
    </div>

    <!-- ── Ventas ─────────────────────────────────────────────────────────── -->
    <div id="vista-ventas" class="tab-content-panel d-none">

        <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
            <button id="loadSalesBtn" class="btn btn-primary">
                <i class="fas fa-download me-1"></i> Cargar Ventas
            </button>
            <div id="salesMeta" style="display:none" class="text-muted small">
                <i class="fas fa-clock me-1"></i> Actualizado: <span id="salesTimestamp"></span>
                &nbsp;·&nbsp; <span id="salesCount"></span> órdenes
            </div>
        </div>

        <div id="salesError"   class="alert alert-danger"  style="display:none"></div>
        <div id="salesLoading" class="text-center py-5"    style="display:none">
            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
            <p class="text-muted mt-2">Consultando Odoo…</p>
        </div>

        <!-- Filtros -->
        <div id="salesFilters" class="card mb-3" style="display:none">
            <div class="card-body py-2 d-flex gap-3 flex-wrap align-items-center">
                <div class="input-group input-group-sm" style="max-width:240px">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" id="salesSearch" class="form-control" placeholder="Buscar cliente u orden…">
                </div>
                <select id="salesDeliveryFilter" class="form-select form-select-sm" style="max-width:190px">
                    <option value="">Todos los estados</option>
                    <option value="pending">Pendiente</option>
                    <option value="partial">Parcial</option>
                    <option value="full">Entregado</option>
                </select>
                <span class="text-muted small ms-auto" id="salesFilterCount"></span>
            </div>
        </div>

        <div id="salesContent"></div>
    </div>

</div>

<style>
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .4; }
}
</style>

<script>
// Datos de cada item renderizado: { id, name, qty, cat }
// Se llena al renderizar, se usa al guardar.
const _itemData = {};

// Serializa los items marcados al campo oculto antes de enviar el form
function serializeSelected() {
    const selected = [];
    document.querySelectorAll('.pgl-checkbox:checked').forEach(cb => {
        const id = parseInt(cb.value);
        if (_itemData[id]) selected.push(_itemData[id]);
    });
    document.getElementById('selectedItemsInput').value = JSON.stringify(selected);
}
const BASE      = '/signage';

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('#mainTabs .nav-link').forEach(btn => {
    btn.addEventListener('click', function () {
        document.querySelectorAll('#mainTabs .nav-link').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content-panel').forEach(p => p.classList.add('d-none'));
        this.classList.add('active');
        document.getElementById(this.dataset.tab).classList.remove('d-none');
    });
});

// ── Carga de datos via AJAX ───────────────────────────────────────────────────
function loadData() {
    document.getElementById('estado-inicial').style.display = 'none';
    document.getElementById('skeleton-lista').style.display = 'block';
    document.getElementById('content-lista').style.display  = 'none';
    document.getElementById('error-lista').style.display    = 'none';

    fetch(BASE + '/data')
        .then(r => { if (r.status === 401) { location.href = '/login'; throw new Error('unauth'); } return r.json(); })
        .then(data => {
            if (data.error) { showListError(data.error); return; }
            renderProduction(data.categorias);
            renderStock(data.low_stock, data.stock_total, data.now);
        })
        .catch(err => { if (err.message !== 'unauth') showListError('Error cargando datos: ' + err.message); });
}

document.getElementById('loadDataBtn').addEventListener('click', loadData);
document.addEventListener('click', e => {
    if (e.target.closest('#reloadDataBtn')) loadData();
});

function showListError(msg) {
    document.getElementById('skeleton-lista').style.display = 'none';
    document.getElementById('error-lista').style.display = 'block';
    document.getElementById('error-lista').textContent = msg;
}

// ── Render producción ─────────────────────────────────────────────────────────
const CAT_LABELS = { inyeccion: 'Inyección', ensamble: 'Ensamble', cepillo: 'Cepillo' };

function renderProduction(categorias) {
    const grid = document.getElementById('productionGrid');
    grid.innerHTML = '';

    for (const [cat, items] of Object.entries(categorias)) {
        const col = document.createElement('div');
        col.className = 'pgl-column';
        col.innerHTML = `
            <div class="pgl-header pgl-header--${cat}">
                <span class="pgl-header__title">${CAT_LABELS[cat] || cat}</span>
                <button type="button" class="pgl-toggle-all" data-category="${cat}">☑ Todos</button>
            </div>
            <div class="pgl-items" data-category="${cat}"></div>`;

        const itemsEl = col.querySelector('.pgl-items');
        items.forEach(item => {
            // Registrar datos del item para serialización al guardar
            _itemData[item.id] = { id: item.id, name: item.name, qty: item.qty, cat };

            const label = document.createElement('label');
            label.className = 'pgl-item';
            label.innerHTML = `
                <input type="checkbox" value="${item.id}" class="pgl-checkbox">
                <span class="pgl-item__name">${item.name}</span>
                <span class="pgl-item__qty">${item.qty.toLocaleString('es-MX')}</span>`;
            label.querySelector('.pgl-checkbox').addEventListener('change', function () {
                label.classList.toggle('pgl-item--checked', this.checked);
            });
            itemsEl.appendChild(label);
        });

        col.querySelector('.pgl-toggle-all').addEventListener('click', function () {
            const boxes = col.querySelectorAll('.pgl-checkbox');
            const allChecked = Array.from(boxes).every(cb => cb.checked);
            boxes.forEach(cb => {
                cb.checked = !allChecked;
                cb.closest('.pgl-item').classList.toggle('pgl-item--checked', !allChecked);
            });
        });

        grid.appendChild(col);
    }

    document.getElementById('skeleton-lista').style.display = 'none';
    document.getElementById('content-lista').style.display  = 'block';
}

// ── Render stock ──────────────────────────────────────────────────────────────
function renderStock(lowStock, total, now) {
    const badge = document.getElementById('stockBadge');
    if (total > 0) { badge.textContent = total; badge.style.display = ''; }

    document.getElementById('stockSummaryCard').style.display = '';
    const summary = document.getElementById('stockSummary');
    if (total > 0) {
        summary.innerHTML = `<h4 class="text-danger mb-1">🚨 ${total} producto(s) con stock bajo</h4>
            <p class="text-muted mb-0 small">Actualizado: <strong>${now}</strong></p>`;
    } else {
        summary.innerHTML = `<h4 class="text-success mb-1">✅ Todos los productos tienen stock suficiente</h4>
            <p class="text-muted mb-0 small">Actualizado: <strong>${now}</strong></p>`;
    }

    // Tabla
    const tableEl = document.getElementById('stockTable');
    if (!lowStock.length) { tableEl.innerHTML = ''; return; }

    const rows = lowStock.map(p => {
        const isNew      = p.is_new      ? '<span class="badge bg-warning text-dark ms-2">🆕 Nuevo</span>'  : '';
        const isCritical = p.is_long_lead ? '<span class="badge bg-danger ms-2">🔴 Crítico</span>' : '';
        const variantLabel = p.variant
            ? `<span class="text-muted small d-block">${p.variant}</span>`
            : '';
        const rowClass = p.is_long_lead
            ? 'class="table-danger"'
            : p.is_new
                ? 'class="table-warning"'
                : 'class="table-info"';
        return `<tr ${rowClass}>
            <td><strong>${p.name}</strong>${isCritical}${isNew}${variantLabel}</td>
            <td class="text-center align-middle"><span class="badge bg-warning text-dark">${p.qty_available.toFixed(2)}</span></td>
            <td class="text-center align-middle">${p.reordering_min_qty.toFixed(2)}</td>
            <td class="text-center align-middle">${p.reordering_max_qty != null ? p.reordering_max_qty.toFixed(2) : '—'}</td>
        </tr>`;
    }).join('');

    tableEl.innerHTML = `
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Productos que Requieren Atención</h5></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Producto</th>
                                <th class="text-center">Stock Actual</th>
                                <th class="text-center">Stock Mínimo</th>
                                <th class="text-center">Stock Máximo</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>
        </div>`;
}

// ── Notificaciones ────────────────────────────────────────────────────────────
function showMessage(message, type = 'info') {
    const cls = {success:'alert-success',error:'alert-danger',warning:'alert-warning',info:'alert-info'}[type]||'alert-info';
    const area = document.getElementById('messageArea');
    area.innerHTML = `<div class="alert ${cls} alert-dismissible fade show">
        ${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(() => { const a = area.querySelector('.alert'); if (a) a.remove(); }, 6000);
}

const iconMap = {
    refreshStockBtn:'fas fa-sync-alt', sendStockReportBtn:'fas fa-bell',
    testNotificationsBtn:'fas fa-paper-plane'
};
function setLoading(btn, loading) {
    btn.disabled = loading;
    const icon = btn.querySelector('i');
    if (icon) icon.className = loading ? 'fas fa-spinner fa-spin' : iconMap[btn.id];
}
function updateStatus(id, ok) {
    const el = document.getElementById(id + 'Status');
    if (!el) return;
    el.className = 'badge ' + (ok ? 'bg-success' : 'bg-danger');
    el.textContent = ok ? 'Activo' : 'Sin configurar';
}
function checkNotificationStatus() {
    fetch(BASE + '/notification-status')
        .then(r => r.json())
        .then(d => {
            updateStatus('email', d.email); updateStatus('telegram', d.telegram);
            updateStatus('callmebot', d.callmebot); updateStatus('whatsappMeta', d.whatsapp_meta);
        });
}

// El botón "Consultar Ahora" del tab stock también dispara loadData
document.getElementById('refreshStockBtn').addEventListener('click', function () {
    // Mostrar spinner mientras carga
    document.getElementById('stockSummaryCard').style.display = '';
    document.getElementById('stockSummary').innerHTML = '<div style="color:#a0aec0"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>';
    document.getElementById('stockTable').innerHTML = '';
    setLoading(this, true); loadData();
    setTimeout(() => setLoading(this, false), 2000);
});

function stockAction(force) {
    const btn = document.getElementById('sendStockReportBtn');
    setLoading(btn, true);
    fetch(BASE + '/check-stock', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({force})
    })
    .then(r => { if (r.status === 401) { location.href='/login'; return; } return r.json(); })
    .then(d => { if (d) showMessage(d.message, d.success ? 'success' : 'error'); })
    .catch(e => showMessage('Error: ' + e.message, 'error'))
    .finally(() => setLoading(btn, false));
}

document.getElementById('sendStockReportBtn').addEventListener('click', () => stockAction(true));
document.getElementById('testNotificationsBtn').addEventListener('click', function () {
    if (!confirm('¿Enviar mensaje de prueba a todos los canales configurados?')) return;
    setLoading(this, true);
    fetch(BASE + '/test-notifications', {method:'POST', headers:{'Content-Type':'application/json'}})
    .then(r => r.json())
    .then(d => { if (d) showMessage(d.message, d.success ? 'success' : 'error'); })
    .catch(e => showMessage('Error: ' + e.message, 'error'))
    .finally(() => setLoading(this, false));
});

// NO se llama loadData() automáticamente — el usuario presiona el botón

// ── Ventas ────────────────────────────────────────────────────────────────────
let _salesData = [];   // cache local para filtrar sin re-fetch

const DELIVERY_LABELS = {
    pending: { text: 'Pendiente', cls: 'bg-secondary' },
    partial: { text: 'Parcial',   cls: 'bg-warning text-dark' },
    full:    { text: 'Entregado', cls: 'bg-success' },
};
const ORDER_STATE_LABELS = {
    sale: { text: 'Confirmada', cls: 'bg-primary' },
    done: { text: 'Cerrada',    cls: 'bg-dark' },
};

function loadSales() {
    const btn = document.getElementById('loadSalesBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Cargando…';

    document.getElementById('salesError').style.display   = 'none';
    document.getElementById('salesLoading').style.display = 'block';
    document.getElementById('salesFilters').style.display = 'none';
    document.getElementById('salesContent').innerHTML     = '';
    document.getElementById('salesMeta').style.display    = 'none';

    fetch(BASE + '/sales-data')
        .then(r => { if (r.status === 401) { location.href = '/login'; throw new Error('unauth'); } return r.json(); })
        .then(data => {
            document.getElementById('salesLoading').style.display = 'none';
            if (data.error) {
                document.getElementById('salesError').textContent = data.error;
                document.getElementById('salesError').style.display = 'block';
                return;
            }
            _salesData = data.orders || [];
            document.getElementById('salesTimestamp').textContent = data.now;
            document.getElementById('salesCount').textContent     = _salesData.length;
            document.getElementById('salesMeta').style.display    = '';
            document.getElementById('salesFilters').style.display = '';
            document.getElementById('ventasBadge').textContent    = _salesData.length;
            document.getElementById('ventasBadge').style.display  = '';
            renderSales(_salesData);
        })
        .catch(err => {
            if (err.message === 'unauth') return;
            document.getElementById('salesLoading').style.display = 'none';
            document.getElementById('salesError').textContent = 'Error: ' + err.message;
            document.getElementById('salesError').style.display = 'block';
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i> Actualizar';
        });
}

function renderSales(orders) {
    const container = document.getElementById('salesContent');
    if (!orders.length) {
        container.innerHTML = '<p class="text-muted text-center py-4">No hay órdenes de venta.</p>';
        return;
    }

    container.innerHTML = orders.map(o => {
        const dlv   = DELIVERY_LABELS[o.delivery_status] || { text: o.delivery_status, cls: 'bg-secondary' };
        const state = ORDER_STATE_LABELS[o.state]        || { text: o.state,            cls: 'bg-secondary' };

        const linesHtml = o.lines.map(l => {
            const stockCls = l.qty_available === 0
                ? 'text-danger fw-bold'
                : l.qty_available < l.ordered_qty
                    ? 'text-warning fw-bold'
                    : 'text-success fw-bold';
            const pct = l.ordered_qty > 0
                ? Math.min(100, Math.round((l.delivered_qty / l.ordered_qty) * 100))
                : 0;
            const barCls = pct === 100 ? 'bg-success' : pct > 0 ? 'bg-warning' : 'bg-secondary';

            return `<tr>
                <td class="ps-3" style="max-width:260px">
                    <span class="fw-medium">${l.product_name}</span>
                </td>
                <td class="text-center">${l.ordered_qty.toLocaleString('es-MX')}</td>
                <td class="text-center">
                    <div class="d-flex align-items-center gap-2 justify-content-center">
                        <div class="progress flex-grow-1" style="height:6px;min-width:60px;max-width:90px">
                            <div class="progress-bar ${barCls}" style="width:${pct}%"></div>
                        </div>
                        <span class="small">${l.delivered_qty.toLocaleString('es-MX')}</span>
                    </div>
                </td>
                <td class="text-center">
                    <span class="${stockCls}">${l.qty_available.toLocaleString('es-MX')}</span>
                </td>
                <td class="text-end pe-3 text-muted small">
                    $${l.price_subtotal.toLocaleString('es-MX', {minimumFractionDigits:2})}
                </td>
            </tr>`;
        }).join('');

        return `
        <div class="card mb-3 shadow-sm sales-card" data-partner="${o.partner.toLowerCase()}" data-name="${o.name.toLowerCase()}" data-delivery="${o.delivery_status}">
            <div class="card-header d-flex align-items-center gap-2 flex-wrap py-2">
                <span class="fw-bold fs-6">${o.name}</span>
                <span class="badge ${state.cls}">${state.text}</span>
                <span class="badge ${dlv.cls}">${dlv.text}</span>
                <span class="ms-auto fw-semibold text-muted small">
                    <i class="fas fa-user me-1"></i>${o.partner}
                </span>
                <span class="text-muted small">
                    <i class="fas fa-calendar me-1"></i>${o.date}
                </span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">Producto</th>
                                <th class="text-center">Ordenado</th>
                                <th class="text-center">Entregado</th>
                                <th class="text-center">En Stock</th>
                                <th class="text-end pe-3">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>${linesHtml}</tbody>
                        <tfoot class="table-light">
                            <tr>
                                <td colspan="4" class="text-end pe-2 fw-semibold ps-3">Total</td>
                                <td class="text-end pe-3 fw-bold">
                                    $${o.amount_total.toLocaleString('es-MX', {minimumFractionDigits:2})}
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('salesFilterCount').textContent = `${orders.length} órdenes`;
}

function filterSales() {
    const search  = document.getElementById('salesSearch').value.toLowerCase().trim();
    const dlvFilt = document.getElementById('salesDeliveryFilter').value;

    const filtered = _salesData.filter(o => {
        const matchText = !search ||
            o.partner.toLowerCase().includes(search) ||
            o.name.toLowerCase().includes(search) ||
            o.lines.some(l => l.product_name.toLowerCase().includes(search));
        const matchDlv  = !dlvFilt || o.delivery_status === dlvFilt;
        return matchText && matchDlv;
    });

    renderSales(filtered);
}

document.getElementById('loadSalesBtn').addEventListener('click', loadSales);
document.getElementById('salesSearch').addEventListener('input', filterSales);
document.getElementById('salesDeliveryFilter').addEventListener('change', filterSales);
</script>
{% endblock %}
