<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción PPG</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            overflow: hidden;
            background: #111827;
            font-family: 'Segoe UI', Arial, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* ── Pantalla sin datos ── */
        #no-data-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #111827; color: #fff; gap: 16px;
            text-align: center; padding: 24px;
        }
        #no-data-screen .icon  { font-size: 4rem; }
        #no-data-screen h2     { font-size: 1.6rem; color: #e2e8f0; font-weight: 700; }
        #no-data-screen p      { color: #6b7280; font-size: 1rem; max-width: 420px; line-height: 1.7; }
        #no-data-screen strong { color: #93c5fd; }

        /* ── Lista principal ── */
        #grid {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px 14px;
            gap: 0;
        }

        #all-items {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }

        /* Cada fila ocupa todo el ancho */
        .prod-row {
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 8px;
            padding: 0 16px;
            flex: 1;          /* reparte el alto equitativamente */
            min-height: 0;
            overflow: hidden;
        }

        /* Color por categoría */
        .prod-row--inyeccion { background: #1e3a5f; border-left: 5px solid #3b82f6; }
        .prod-row--ensamble  { background: #7c2d00; border-left: 5px solid #f97316; }
        .prod-row--cepillo   { background: #064e2e; border-left: 5px solid #22c55e; }

        .prod-row__cat {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45);
            white-space: nowrap;
            flex-shrink: 0;
            width: 7em;       /* ancho fijo para alinear nombres */
        }

        .prod-row__name {
            flex: 1;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .prod-row__qty {
            font-weight: 800;
            color: #fff;
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 4px 16px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Timestamp */
        #last-updated {
            position: fixed;
            bottom: 6px;
            right: 12px;
            font-size: 0.62rem;
            color: rgba(255,255,255,0.18);
        }
    </style>
</head>
<body>

    <div id="no-data-screen">
        <div class="icon">📭</div>
        <h2>Sin datos de producción</h2>
        <p>
            Abre el panel de producción, carga los datos de Odoo,
            selecciona los productos y presiona
            <strong>"Guardar Selección"</strong>.
        </p>
    </div>

    <div id="grid" style="display:none">
        <div id="all-items"></div>
    </div>

    <div id="last-updated"></div>

    <script>
    const CAT_LABEL = { inyeccion: 'Inyección', ensamble: 'Ensamble', cepillo: 'Cepillo' };
    const CAT_ORDER = ['inyeccion', 'ensamble', 'cepillo'];

    function renderGrid(data) {
        const items = data.items || [];

        if (!items.length) {
            document.getElementById('grid').style.display = 'none';
            document.getElementById('no-data-screen').style.display = '';
            return;
        }

        // Ordenar: primero por categoría (orden fijo), luego por nombre
        items.sort((a, b) => {
            const ci = CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat);
            if (ci !== 0) return ci;
            return a.name.localeCompare(b.name, 'es');
        });

        const container = document.getElementById('all-items');
        container.innerHTML = items.map(item => `
            <div class="prod-row prod-row--${item.cat}">
                <span class="prod-row__cat">${CAT_LABEL[item.cat] || item.cat}</span>
                <span class="prod-row__name">${item.name}</span>
                <span class="prod-row__qty">${Number(item.qty).toLocaleString('es-MX')}</span>
            </div>`).join('');

        document.getElementById('no-data-screen').style.display = 'none';
        document.getElementById('grid').style.display = '';

        if (data.now) {
            document.getElementById('last-updated').textContent = 'Actualizado: ' + data.now;
        }

        requestAnimationFrame(() => adjustFontSize(items.length));
    }

    function adjustFontSize(count) {
        if (!count) return;
        const container = document.getElementById('all-items');
        const availH    = container.clientHeight;
        const gap       = 6; // igual al CSS gap
        const itemH     = (availH - gap * (count - 1)) / count;
        const fs        = Math.max(11, Math.min(Math.floor(itemH * 0.42), 56));

        container.querySelectorAll('.prod-row__name, .prod-row__cat, .prod-row__qty').forEach(el => {
            el.style.fontSize = fs + 'px';
        });
    }

    window.addEventListener('resize', () => {
        const count = document.querySelectorAll('.prod-row').length;
        if (count) adjustFontSize(count);
    });

    function connect() {
        const es = new EventSource('/signage/events');
        es.onmessage = e => {
            try { renderGrid(JSON.parse(e.data)); }
            catch (err) { console.error('SSE parse error:', err); }
        };
        es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }

    connect();
    </script>
</body>
</html>
